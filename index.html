<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Task Manager</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1>Mini Task Manager</h1>
        <p>Ứng dụng quản lý công việc cá nhân</p>
      </div>
    </header>

    <main class="container">
      <!-- Form thêm công việc -->
      <section class="card form-section">
        <h2>Thêm công việc mới</h2>
        <form id="task-form">
          <div class="form-group">
            <label for="task-title"
              >Tên công việc <span class="required">*</span></label
            >
            <input
              type="text"
              id="task-title"
              placeholder="Nhập tên công việc..."
            />
            <small class="error-message" id="title-error"></small>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="task-date">Hạn hoàn thành</label>
              <input type="date" id="task-date" />
              <small class="error-message" id="date-error"></small>
            </div>

            <div class="form-group">
              <label for="task-priority">Mức ưu tiên</label>
              <select id="task-priority">
                <option value="Cao">Cao</option>
                <option value="Trung bình" selected>Trung bình</option>
                <option value="Thấp">Thấp</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">Thêm công việc</button>
        </form>
      </section>

      <!-- Công cụ tìm kiếm và lọc -->
      <section class="card filter-section">
        <div class="filter-controls">
          <div class="search-box">
            <input
              type="text"
              id="search-input"
              placeholder="Tìm kiếm theo tên công việc..."
            />
          </div>
          <div class="status-filter">
            <label for="status-select">Trạng thái:</label>
            <select id="status-select">
              <option value="all">Tất cả</option>
              <option value="pending">Chưa hoàn thành</option>
              <option value="done">Đã hoàn thành</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Vùng hiển thị danh sách -->
      <section class="card list-section">
        <h2>Danh sách công việc</h2>
        <div id="task-list" class="task-list"></div>
      </section>
    </main>

    <footer class="site-footer">
      Sinh viên: Đỗ Minh Hằng | MSSV: 224001716 | Lớp: TUD D2024
    </footer>

    <!-- Khung thông báo trượt Toast Notification -->
    <div id="toast" class="toast"></div>
  </body>
</html>
